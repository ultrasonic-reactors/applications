<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — Ultrasonic Reactors</title>
  <!-- Self-contained: a 404 can be served at any URL depth, so no external assets. -->
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
      color: #e2e8f0;
      background: linear-gradient(135deg, #0b2239 0%, #123a5c 60%, #1b5a8a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.6;
    }
    main { padding: 2rem; }
    h1 { color: #ffffff; font-size: clamp(2rem, 5vw, 3rem); margin: 0 0 1rem; }
    p { color: #cbd5e1; margin: 0 0 2rem; }
    .button {
      display: inline-block;
      background: #0ea5e9;
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      padding: 0.8rem 1.8rem;
      border-radius: 999px;
    }
    .button:hover { background: #0284c7; }
  </style>
</head>
<body>

<main>
  <h1>Page not found</h1>
  <p>The page you are looking for does not exist or has moved.</p>
  <a class="button" href="/applications/">Back to home</a>
</main>

</body>
</html>
